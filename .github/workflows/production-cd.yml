name: CRM production release
on:
  workflow_run:
    workflows: [CRM verification]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: telite-crm-production
  cancel-in-progress: false
jobs:
  images:
    # Only trusted main push CI can publish; PR runs and forks are excluded.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Identify tested release
        id: release
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          CURRENT_MAIN=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$RELEASE_SHA" == "$CURRENT_MAIN" ]] || { echo "A newer main commit exists; release skipped."; exit 1; }
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/backend.Dockerfile
          push: true
          tags: ghcr.io/naveensabapathi/telite_crm-backend:sha-${{ steps.release.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/NaveenSabapathi/telite_crm
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/frontend.Dockerfile
          push: true
          tags: ghcr.io/naveensabapathi/telite_crm-web:sha-${{ steps.release.outputs.sha }}
          labels: org.opencontainers.image.source=https://github.com/NaveenSabapathi/telite_crm
  deploy:
    needs: images
    # Set this repository variable only AFTER completing the manual first deployment.
    if: vars.CRM_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Deploy tested image tag through restricted SSH command
        env:
          DEPLOY_HOST: ${{ secrets.CRM_DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.CRM_DEPLOY_PORT }}
          DEPLOY_KEY: ${{ secrets.CRM_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.CRM_SSH_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ needs.images.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ && "$DEPLOY_HOST" != -* ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/crm_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/crm_deploy"' EXIT
          ssh -i "$HOME/.ssh/crm_deploy" -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "crmdeploy@$DEPLOY_HOST" "deploy $RELEASE_SHA"
