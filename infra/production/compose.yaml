# Standalone production file: do not merge with the development compose.yaml.
name: telitecrm
x-common: &common
  APP_ENV: production
  PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?Set HTTPS origin}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set domain without scheme}
  COOKIE_SECURE: "true"
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Required}
  SMTP_HOST: ${SMTP_HOST:?Required}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_STARTTLS: "true"
  SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:?Required}
x-runtime: &runtime
  image: ghcr.io/naveensabapathi/telite_crm-backend:sha-${IMAGE_TAG:?Release SHA required}
  restart: unless-stopped
  init: true
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  db:
    image: ${CRM_POSTGRES_IMAGE:?Pin a PostgreSQL 17 image digest}
    restart: unless-stopped
    environment:
      POSTGRES_DB: telite
      POSTGRES_USER: migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 512m
    cpus: 0.40
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U migrator -d telite"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
  migrate:
    <<: *runtime
    restart: "no"
    profiles: [tools]
    mem_limit: 384m
    cpus: 0.40
    environment:
      <<: *common
      DATABASE_URL: postgresql+psycopg://crm_api:${API_DB_PASSWORD:?Required}@db:5432/telite
      MIGRATION_DATABASE_URL: postgresql+psycopg://migrator:${POSTGRES_PASSWORD}@db:5432/telite
      API_DB_PASSWORD: ${API_DB_PASSWORD}
      CONTROL_DB_PASSWORD: ${CONTROL_DB_PASSWORD:?Required}
      MAIL_DB_PASSWORD: ${MAIL_DB_PASSWORD:?Required}
      OPERATIONS_DB_PASSWORD: ${OPERATIONS_DB_PASSWORD:?Required}
    command: [sh, -c, "alembic upgrade head && python -m app.provision roles"]
  api:
    <<: *runtime
    mem_limit: 384m
    cpus: 0.40
    environment:
      <<: *common
      DATABASE_URL: postgresql+psycopg://crm_api:${API_DB_PASSWORD}@db:5432/telite
      OPERATIONS_DATABASE_URL: postgresql+psycopg://crm_operations:${OPERATIONS_DB_PASSWORD}@db:5432/telite
      JWT_SECRET: ${JWT_SECRET:?Required}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/live',headers={'Host':'${ALLOWED_HOSTS}'}),timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  control:
    <<: *runtime
    mem_limit: 256m
    cpus: 0.30
    environment:
      <<: *common
      DATABASE_URL: postgresql+psycopg://crm_control:${CONTROL_DB_PASSWORD}@db:5432/telite
      CONTROL_DATABASE_URL: postgresql+psycopg://crm_control:${CONTROL_DB_PASSWORD}@db:5432/telite
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:?Required}
    command: [uvicorn, "app.control_api:app", --host, "0.0.0.0", --port, "8000", --proxy-headers, "--forwarded-allow-ips=*"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/live',headers={'Host':'${ALLOWED_HOSTS}'}),timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
  auth-mail:
    <<: *runtime
    mem_limit: 256m
    cpus: 0.25
    environment:
      <<: *common
      DATABASE_URL: postgresql+psycopg://crm_mail:${MAIL_DB_PASSWORD}@db:5432/telite
      MAIL_DATABASE_URL: postgresql+psycopg://crm_mail:${MAIL_DB_PASSWORD}@db:5432/telite
      OPERATIONS_DATABASE_URL: postgresql+psycopg://crm_operations:${OPERATIONS_DB_PASSWORD}@db:5432/telite
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    command: [python, -m, app.mail_worker]
  web:
    image: ghcr.io/naveensabapathi/telite_crm-web:sha-${IMAGE_TAG}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:18080:8080"]
    mem_limit: 96m
    cpus: 0.20
    depends_on: [api, control]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
volumes:
  pgdata:
    name: telitecrm_pgdata
